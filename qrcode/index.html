<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem("tools-theme") ??
            (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            padding: 2rem;
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: var(--text-strong);
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            background-color: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            border-color: var(--accent);
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:disabled {
            background-color: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
        }
        .qr-output {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed var(--border-soft);
            text-align: center;
        }
        .qr-output img {
            width: 256px;
            height: 256px;
            image-rendering: pixelated;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .actions button {
            flex: 1;
        }
        .secondary {
            background-color: var(--btn2);
        }
        .secondary:hover {
            background-color: var(--btn2-hover);
        }
        :root {
            color-scheme: dark;
            --bg: #131417;
            --surface: #191b20;
            --surface-hover: #1c2027;
            --border: #3a3e47;
            --border-soft: #2a2d34;
            --text: #e6e6e6;
            --text-strong: #f5f5f5;
            --text-hover: #cfd3da;
            --muted: #9a9fa8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --focus: #93c5fd;
            --btn2: #3a3e47;
            --btn2-hover: #4b525e;
            --disabled-bg: #2a2d34;
            --disabled-text: #6b7078;
            --danger: #f87171;
            --checker-a: #26282e;
            --checker-b: #1a1c21;
            --track: #2a2d34;
        }
        [data-theme="light"] {
            color-scheme: light;
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-hover: #eef1f5;
            --border: #d7dade;
            --border-soft: #e2e4e8;
            --text: #24292f;
            --text-strong: #101418;
            --text-hover: #3c4148;
            --muted: #6a737d;
            --accent: #007bff;
            --accent-hover: #0069d9;
            --focus: #0b5ed7;
            --btn2: #e9ecef;
            --btn2-hover: #dee2e6;
            --disabled-bg: #e9ecef;
            --disabled-text: #868e96;
            --danger: #dc3545;
            --checker-a: #d3d7dc;
            --checker-b: #e8eaee;
            --track: #e2e4e8;
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            width: 40px;
            height: 40px;
            flex: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 50%;
        }
        .theme-toggle:hover {
            background-color: var(--surface-hover);
            border-color: var(--accent);
        }
        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }
        [data-theme="dark"] .icon-moon { display: none; }
        [data-theme="light"] .icon-sun { display: none; }
    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
</button>

<div class="container">
    <h2>QR Code Generator</h2>
    <p class="subtitle">Enter text or a URL and generate a QR code:</p>

    <textarea id="inputData" placeholder="https://example.com"></textarea>

    <button onclick="generate()">Generate</button>

    <div class="qr-output" id="output" style="display:none;">
        <img id="qrImage" alt="QR Code">
        <div class="actions">
            <button onclick="download()">Download</button>
            <button class="secondary" onclick="copy()">Copy to Clipboard</button>
        </div>
    </div>
</div>

<script>
    let currentDataUrl = "";
    document.getElementById("themeToggle").addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("tools-theme", next);
    });

    function generate() {
        const text = document.getElementById("inputData").value.trim();
        if (!text) {
            alert("Please enter some text or a URL.");
            return;
        }

        // typeNumber 0 = auto-size, 'M' = medium error correction
        const qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();

        // Render the QR modules onto a canvas so we can export a real PNG.
        const cellSize = 8;
        const margin = 4;
        const count = qr.getModuleCount();
        const size = (count + margin * 2) * cellSize;

        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = "#000000";
        for (let row = 0; row < count; row++) {
            for (let col = 0; col < count; col++) {
                if (qr.isDark(row, col)) {
                    ctx.fillRect(
                        (col + margin) * cellSize,
                        (row + margin) * cellSize,
                        cellSize,
                        cellSize
                    );
                }
            }
        }

        currentDataUrl = canvas.toDataURL("image/png");
        document.getElementById("qrImage").src = currentDataUrl;
        document.getElementById("output").style.display = "block";
    }

    function download() {
        if (!currentDataUrl) return;
        const a = document.createElement("a");
        a.href = currentDataUrl;
        a.download = "qrcode.png";
        a.click();
    }

    async function copy() {
        if (!currentDataUrl) return;
        try {
            const blob = await (await fetch(currentDataUrl)).blob();
            await navigator.clipboard.write([
                new ClipboardItem({ [blob.type]: blob })
            ]);
            alert("Copied to clipboard!");
        } catch (e) {
            alert("Copy failed. Your browser may not support copying images.");
        }
    }

    // Allow Ctrl/Cmd+Enter to generate
    document.getElementById("inputData").addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") generate();
    });
</script>

</body>
</html>
